spring:
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:university
    username: sa
    password:
    driver-class-name: org.h2.Driver
    ddl-auto: create-drop
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
  jackson:
    default-property-inclusion: NON_NULL